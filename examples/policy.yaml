version: 1
rules:
  - name: no-production-without-human
    when:
      environment: production
      action: deploy
    require:
      human_approval: true
    priority: 100
  - name: restrict-database
    when:
      resource: database/*
    allow:
      operations: [read]
    deny:
      operations: [drop, truncate]
    priority: 90
  - name: coding-agent
    when:
      agent.role: coder
    allow:
      operations: [read, write, commit, github.pr.create]
    priority: 50
