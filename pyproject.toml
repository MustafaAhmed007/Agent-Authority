[project]
name = "agent-authority"
version = "0.1.0"
description = "Vendor-neutral runtime authority, authorization, verification and audit layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{name="MustafaAhmed007"}]
dependencies = ["cryptography>=43.0.0", "PyYAML>=6.0.2", "pydantic>=2.9.0", "typer>=0.12.5", "rich>=13.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.6.9", "mypy>=1.12.0"]

[project.scripts]
authority = "agent_authority.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_authority"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
