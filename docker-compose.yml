services:
  authority:
    build: .
    ports:
      - "8765:8765"
    environment:
      AUTHORITY_ADMIN_SECRET: ${AUTHORITY_ADMIN_SECRET:?set AUTHORITY_ADMIN_SECRET}
      AUTHORITY_DB: /data/authority.db
    volumes:
      - authority-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

volumes:
  authority-data:
